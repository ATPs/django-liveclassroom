{% load static %}
<!doctype html>
<html lang="{{ active_lang|default:'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LiveClassroom{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'liveclassroom/liveclassroom.css' %}">
    <link rel="stylesheet" href="{% static 'liveclassroom/liveclassroom-surfaces.css' %}">
    <link rel="stylesheet" href="{% static 'liveclassroom/liveclassroom-authoring.css' %}">
    <link rel="stylesheet" href="{% static 'liveclassroom/liveclassroom-teaching.css' %}">
    <link rel="stylesheet" href="{% static 'liveclassroom/liveclassroom-responsive.css' %}">
    <script type="module" src="{% static 'liveclassroom/app.js' %}"></script>
  </head>
  <body data-liveclassroom-static-url="{% get_static_prefix %}">
    <div hidden aria-hidden="true">{% csrf_token %}</div>
    <main id="liveclassroom-root">
      {% if classroom_shell %}
        {{ navigation_bootstrap|json_script:"liveclassroom-navigation-bootstrap" }}
        <div class="lc-shell" data-classroom-shell data-sidebar="expanded">
          <script>try{var b=JSON.parse(document.getElementById('liveclassroom-navigation-bootstrap').textContent||'{}'),k='liveclassroom:shell:'+(b.preference_namespace||'liveclassroom'),p=JSON.parse(localStorage.getItem(k)||'{}'),s=document.querySelector('[data-classroom-shell]');var c=(window.innerWidth<768)?true:(p&&p.version===2?Boolean(p.collapsed):false);if(s)s.dataset.sidebar=c?'collapsed':'expanded';}catch(e){}</script>
          <a class="lc-skip-link" href="#liveclassroom-content">Skip to content</a>
          <header class="lc-shell-header" data-liveclassroom-shell-header>
            <div class="lc-shell-header-identity" data-liveclassroom-shell-header-content></div>
            <div class="lc-shell-header-right">
              <div id="lc-session-action-slot" class="lc-session-action-slot" aria-live="polite"></div>
              <div class="lc-shell-header-utilities" data-liveclassroom-shell-header-utilities></div>
            </div>
          </header>
          <div class="lc-shell-body">
            <div class="lc-shell-drawer-overlay" data-liveclassroom-shell-overlay></div>
            <aside class="lc-shell-sidebar" data-liveclassroom-shell-navigation></aside>
            <div class="lc-shell-content" id="liveclassroom-content" tabindex="-1">
      {% endif %}
      {% block content %}{% endblock %}
      {% if classroom_shell %}
            </div>
          </div>
        </div>
      {% endif %}
    </main>
  </body>
</html>
