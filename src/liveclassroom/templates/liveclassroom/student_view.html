{% extends liveclassroom_base_template %}
{% block title %}Student view · {{ session.title }}{% endblock %}
{% block content %}
  <section class="lc-card lc-wide" data-student-view data-participants-url="{% url 'liveclassroom:api-v1-participants' session.id %}" data-activate-url="{% url 'liveclassroom:api-v1-student-view-activate' session.id %}" data-state-url="{% url 'liveclassroom:api-v1-state' session.id %}">
    <label>Participant <select data-student-view-participant></select></label>
    <button type="button" data-student-view-inspect>Inspect</button>
    <button type="button" data-student-view-activate>Act as participant</button>
    <p data-student-view-status aria-live="polite"></p>
  </section>
  <section class="lc-card lc-wide" data-liveclassroom-app data-audience="student" data-websocket-url="{{ websocket_url }}" data-locale="{{ active_lang|default:'en' }}">
    {% include "liveclassroom/student_surface.html" %}
  </section>
{% endblock %}
