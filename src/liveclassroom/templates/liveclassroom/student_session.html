{% extends "liveclassroom/base.html" %}
{% block title %}{{ session.course }} · LiveClassroom{% endblock %}
{% block content %}
  <section class="lc-card" data-session-id="{{ session.id }}" data-pending-name="{{ pending_name|default:'' }}">
    <p class="lc-kicker">{{ session.course }}</p>
    <h1 id="student-title">Connecting…</h1>
    <div id="student-content"><p>Waiting for the teacher.</p></div>
  </section>
  <script>
    const root = document.querySelector("[data-session-id]");
    const sessionId = root.dataset.sessionId;
    const pendingName = root.dataset.pendingName;
    let joined = false;
    function csrf() { return document.cookie.match(/(?:^|;)\s*csrftoken=([^;]+)/)?.[1] || ""; }
    function elt(tag, text) { const node = document.createElement(tag); node.textContent = text; return node; }
    async function join() {
      if (!pendingName) return;
      const response = await fetch(`/api/sessions/join/{{ session.join_code }}/`, {method: "POST", headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()}, body: JSON.stringify({display_name: pendingName})});
      if (response.ok) joined = true;
      else document.querySelector("#student-content").textContent = (await response.json()).detail;
    }
    async function refresh() {
      const state = await fetch(`/api/sessions/${sessionId}/state/`).then(r => r.json());
      const activity = state.current_activity;
      const box = document.querySelector("#student-content");
      box.replaceChildren();
      if (!activity) { document.querySelector("#student-title").textContent = "Waiting for the teacher"; box.append(elt("p", "The teacher has not published an item yet.")); return; }
      const definition = activity.definition;
      document.querySelector("#student-title").textContent = definition.title || definition.kind;
      const question = definition.question;
      if (!question) { box.append(elt("p", definition.content.markdown || "Content published.")); return; }
      box.append(elt("p", question.stem_markdown));
      const choices = question.data.options || [];
      const form = document.createElement("form");
      for (const option of choices) {
        const label = document.createElement("label"); const input = document.createElement("input"); input.type = "radio"; input.name = "choice"; input.value = option.id; input.disabled = activity.state !== "open" || !!state.my_submission; label.append(input, ` ${option.text}`); form.append(label, document.createElement("br"));
      }
      if (activity.state === "open" && !state.my_submission) {
        const button = elt("button", "Submit answer"); button.type = "submit"; form.append(button);
        form.onsubmit = async (event) => { event.preventDefault(); const choice = new FormData(form).get("choice"); if (!choice) return; const response = await fetch(`/api/activities/${activity.id}/submissions/`, {method: "POST", headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()}, body: JSON.stringify({answer: {choice}})}); if (!response.ok) alert((await response.json()).detail); await refresh(); };
      }
      box.append(form);
      if (state.my_submission) box.append(elt("p", "✓ Submitted — waiting for the teacher."));
      if (activity.state === "revealed") { box.append(elt("p", `Answer: ${(question.answer || []).join(", ")}`)); if (question.explanation_markdown) box.append(elt("p", question.explanation_markdown)); }
    }
    (async () => {
      await join();
      await refresh();
      const socketScheme = location.protocol === "https:" ? "wss" : "ws";
      const sessionSocket = new WebSocket(`${socketScheme}://${location.host}/ws/liveclassroom/sessions/${sessionId}/`);
      sessionSocket.onmessage = () => refresh();
      // Polling is a reconnect-safe fallback when a network blocks WebSockets.
      setInterval(refresh, 3000);
    })();
  </script>
{% endblock %}
