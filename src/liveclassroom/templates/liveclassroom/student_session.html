{% extends "liveclassroom/base.html" %}
{% block title %}{{ session.title }} · LiveClassroom{% endblock %}
{% block content %}
  <section class="lc-card" data-session-id="{{ session.id }}" data-pending-name="{{ pending_name|default:'' }}" data-access-mode="{{ session.access_mode }}" data-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}" data-guest-join-url="{% url 'liveclassroom:api-v1-join' session.join_code %}" data-account-join-url="{% url 'liveclassroom:api-v1-join-account' session.id %}" data-liveclassroom-app data-audience="student" data-state-url="{% url 'liveclassroom:api-v1-state' session.id %}" data-websocket-url="{{ websocket_url }}" data-locale="{{ active_lang|default:'en' }}">
    <button type="button" class="lc-lang-switch" aria-label="Switch language / 切换语言">EN / 中文</button>
    <p class="lc-kicker">{{ session.title }}</p>
    <h1 id="student-title">Connecting...</h1>
    <div id="student-content" data-liveclassroom-content><p>Waiting for the teacher.</p></div>
    <p data-liveclassroom-status aria-live="polite">Connecting...</p>
    <section class="lc-chat" data-liveclassroom-chat aria-labelledby="student-chat-heading">
      <h2 id="student-chat-heading">Class chat</h2>
      <p data-liveclassroom-chat-status aria-live="polite"></p>
      <ul data-liveclassroom-chat-messages aria-live="polite"><li>Chat is disabled.</li></ul>
      <form data-liveclassroom-chat-form>
        <label>Message <textarea name="body" rows="2" maxlength="4000"></textarea></label>
        <button type="submit">Send</button>
      </form>
    </section>
    <section data-liveclassroom-history aria-live="polite"></section>
  </section>
{% endblock %}
