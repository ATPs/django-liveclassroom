{% extends liveclassroom_base_template %}
{% block title %}Teacher console · LiveClassroom{% endblock %}
{% block content %}
  <div class="lc-page-stack">
    <p class="lc-context-help-link">{% include "liveclassroom/_help_link.html" %}</p>
    <section class="lc-card lc-wide"
      data-liveclassroom-app data-audience="teacher"
      data-capabilities='{{ capabilities_json }}'
      data-workspace-url="{% url 'liveclassroom:teacher-dashboard' %}?lang={{ active_lang|urlencode }}"
      data-session-id="{{ session.id }}"
      data-is-superuser="{{ request.user.is_superuser|yesno:'true,false' }}"
      data-state-url="{% url 'liveclassroom:api-v1-state' session.id %}"
      data-websocket-url="{{ websocket_url }}"
      data-locale="{{ active_lang|default:'en' }}"
      data-session-title="{{ session.title }}"
      data-flow-title="{{ flow_title }}"
      data-join-code="{{ session.join_code }}"
      data-join-url="{% url 'liveclassroom:join' %}?code={{ session.join_code|urlencode }}"
      data-display-url="{% url 'liveclassroom:classroom-display' session.id %}?lang={{ active_lang|urlencode }}"
      data-qr-url="{% url 'liveclassroom:join-qr' session.id %}"
      data-export-url="{% url 'liveclassroom:api-v1-export' session.id %}"
      data-builder-url="{% url 'liveclassroom:flow-builder' %}?session_id={{ session.id }}&amp;lang={{ active_lang|urlencode }}"
      data-student-view-url="{% url 'liveclassroom:student-view' session.id %}?lang={{ active_lang|urlencode }}"
      data-flow-steps='{{ flow_steps_json }}'>
      <noscript><p>The live console needs JavaScript.</p></noscript>
    </section>
  </div>
{% endblock %}
