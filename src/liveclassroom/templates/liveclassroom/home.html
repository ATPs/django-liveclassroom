{% extends liveclassroom_base_template %}
{% load i18n %}
{% block title %}LiveClassroom{% endblock %}
{% block content %}
  <section class="lc-workspace-page" data-home-workspace
    data-home-url="{% url 'liveclassroom:api-v1-browse-home' %}"
    data-mode="{{ navigation_bootstrap.mode }}"
    data-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}"
    data-join-url="{% url 'liveclassroom:join' %}"
    data-help-url="{% url 'liveclassroom:help' %}">
    <h1>LiveClassroom</h1>
  </section>
{% endblock %}
