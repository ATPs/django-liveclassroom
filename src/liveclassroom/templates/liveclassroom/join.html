{% extends liveclassroom_base_template %}
{% load i18n %}
{% block title %}{% translate "Join" %} · LiveClassroom{% endblock %}
{% block content %}
  <section class="lc-card">
    <p class="lc-kicker">{% translate "Student" %}</p>
    <h1>{% translate "Join a classroom" %}</h1>
    <form method="post" class="lc-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">{% translate "Join" %}</button>
    </form>
  </section>
{% endblock %}
