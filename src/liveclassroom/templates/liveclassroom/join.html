{% extends "liveclassroom/base.html" %}
{% block title %}Join · LiveClassroom{% endblock %}
{% block content %}
  <section class="lc-card">
    <p class="lc-kicker">Student</p>
    <h1>Join a classroom</h1>
    <form method="post" class="lc-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Join</button>
    </form>
  </section>
{% endblock %}
